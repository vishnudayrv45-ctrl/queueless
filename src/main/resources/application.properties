spring.application.name=QueueLess
server.port=8080

# ---- Database (H2, stored in a file so data survives restarts) ----
spring.datasource.url=jdbc:h2:file:./data/queueless
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tables are created / updated automatically from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Browser database viewer: http://localhost:8080/h2-console  (turn off in real deployments)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Admin login (change these before real use) ----
queueless.admin.username=admin
queueless.admin.password=admin123
queueless.admin.session-hours=8

# ---- Language files (src/main/resources/messages*.properties, UTF-8) ----
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ---- WhatsApp notifications ----
# mode: demo  = no real sending, messages are stored and shown in the demo phone screen (default)
#       cloud = real WhatsApp Business Cloud API; needs the two environment variables below
queueless.whatsapp.mode=${WHATSAPP_MODE:demo}
queueless.whatsapp.access-token=${WHATSAPP_TOKEN:}
queueless.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
queueless.whatsapp.api-version=${WHATSAPP_API_VERSION:v20.0}
queueless.whatsapp.country-code=${WHATSAPP_COUNTRY_CODE:91}
# starting values; admins change them later in the dashboard (stored in the database)
queueless.whatsapp.default-enabled=true
queueless.whatsapp.approach-threshold=3
