wa.confirmation=QueueLess: {1} சேவைக்கான உங்கள் டோக்கன் {0} உறுதி செய்யப்பட்டது.\nநிலை: {2} (முன்னால் உள்ளவர்கள்: {3})\nமதிப்பிடப்பட்ட காத்திருப்பு: {4}\nஉங்கள் முறை நெருங்கும்போது செய்தி அனுப்புவோம்.
wa.approaching=QueueLess: உங்கள் முறை நெருங்கிவிட்டது! டோக்கன் {0} ({1})\nமுன்னால் உள்ளவர்கள்: {3} (நிலை {2})\nமதிப்பிடப்பட்ட காத்திருப்பு: {4}\nஇப்போதே அலுவலகத்துக்குப் புறப்படுங்கள்.
wa.called=QueueLess: டோக்கன் {0} இப்போது அழைக்கப்படுகிறது!\n{1} சேவைக்கு {5} க்குச் செல்லுங்கள்.
wa.skipped=QueueLess: டோக்கன் {0} ({1}) அழைக்கப்பட்டது, ஆனால் நீங்கள் வராததால் தாமதம் எனக் குறிக்கப்பட்டு மூடப்பட்டது. புதிய டோக்கன் பெறவும் அல்லது ஊழியரிடம் உதவி கேட்கவும்.
wa.cancelled=QueueLess: டோக்கன் {0} ({1}) ரத்து செய்யப்பட்டது. QueueLess இணையதளத்தில் எப்போது வேண்டுமானாலும் புதிய டோக்கன் பெறலாம்.

